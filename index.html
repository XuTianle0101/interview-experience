<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>offerseed 面经合集</title>
<style>
:root {
  --bg: #f8f9fa;
  --card: #ffffff;
  --border: #e2e8f0;
  --text: #1a202c;
  --text-secondary: #64748b;
  --accent: #3b82f6;
  --accent-dark: #2563eb;
  --code-bg: #f1f5f9;
  --green: #16a34a;
  --green-light: #dcfce7;
  --orange: #ea580c;
  --orange-light: #fed7aa;
  --red: #dc2626;
  --red-light: #fee2e2;
  --purple: #7c3aed;
  --purple-light: #ede9fe;
  --teal: #0d9488;
  --teal-light: #ccfbf1;
  --pink: #db2777;
  --pink-light: #fce7f3;
  --indigo: #4f46e5;
  --indigo-light: #e0e7ff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}
.hero {
  background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #3b82f6 100%);
  color: white;
  padding: 64px 24px 48px;
  text-align: center;
}
.hero h1 { font-size: 2rem; margin-bottom: 12px; font-weight: 800; letter-spacing: -0.02em; }
.hero p { font-size: 1rem; opacity: 0.8; max-width: 600px; margin: 0 auto 24px; }
.search-box {
  max-width: 480px;
  margin: 0 auto;
  position: relative;
}
.search-box input {
  width: 100%;
  padding: 12px 20px 12px 44px;
  border: none;
  border-radius: 12px;
  font-size: 0.95rem;
  background: rgba(255,255,255,0.95);
  color: var(--text);
  outline: none;
}
.search-box svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  fill: var(--text-secondary);
}
.container { max-width: 960px; margin: 0 auto; padding: 32px 20px 64px; }
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 28px;
  justify-content: center;
}
.filter-btn {
  padding: 6px 16px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--card);
  color: var(--text-secondary);
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.15s;
}
.filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.filter-btn.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  text-decoration: none;
  color: inherit;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.card:hover {
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  transform: translateY(-2px);
  border-color: var(--accent);
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.card-company { font-size: 0.8rem; color: var(--text-secondary); font-weight: 500; }
.card-tag {
  font-size: 0.72rem;
  padding: 2px 10px;
  border-radius: 12px;
  white-space: nowrap;
}
.card-title { font-size: 1.05rem; font-weight: 600; color: var(--text); }
.card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 0.8rem;
  color: var(--text-secondary);
}
.card-meta span { display: inline-flex; align-items: center; gap: 3px; }
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-secondary);
}
.stats {
  display: flex;
  justify-content: center;
  gap: 32px;
  margin-bottom: 24px;
}
.stat { text-align: center; }
.stat-num { font-size: 1.5rem; font-weight: 700; color: white; }
.stat-label { font-size: 0.75rem; opacity: 0.7; }
.footer {
  text-align: center;
  padding: 32px 20px;
  color: var(--text-secondary);
  font-size: 0.82rem;
}
.footer a { color: var(--accent); text-decoration: none; }

.tag-后端 { background: var(--indigo-light); color: var(--indigo); }
.tag-前端 { background: var(--teal-light); color: var(--teal); }
.tag-算法 { background: var(--purple-light); color: var(--purple); }
.tag-Agent { background: var(--green-light); color: var(--green); }
.tag-Infra { background: var(--orange-light); color: var(--orange); }
.tag-数据 { background: var(--pink-light); color: var(--pink); }
.tag-架构 { background: var(--code-bg); color: var(--text-secondary); }
.tag-安全 { background: var(--red-light); color: var(--red); }
</style>
</head>
<body>

<div class="hero">
  <h1>offerseed 面经合集</h1>
  <p>互联网大厂 & AI 公司真实面试经验，按公司、方向分类整理，持续更新中。</p>
  <div class="search-box">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input type="text" id="search" placeholder="搜索公司、岗位、方向..." />
  </div>
  <div class="stats" style="margin-top: 20px;">
    <div class="stat"><div class="stat-num" id="stat-total">0</div><div class="stat-label">面经数</div></div>
    <div class="stat"><div class="stat-num" id="stat-companies">0</div><div class="stat-label">公司数</div></div>
    <div class="stat"><div class="stat-num">8</div><div class="stat-label">方向</div></div>
  </div>
</div>

<div class="container">
  <div class="filters" id="filters">
    <button class="filter-btn active" data-cat="all">全部</button>
    <button class="filter-btn" data-cat="后端服务端">后端/服务端</button>
    <button class="filter-btn" data-cat="前端客户端">前端/客户端</button>
    <button class="filter-btn" data-cat="大模型算法">大模型/算法</button>
    <button class="filter-btn" data-cat="Agent开发">Agent开发</button>
    <button class="filter-btn" data-cat="AI-Infra">AI Infra</button>
    <button class="filter-btn" data-cat="数据">数据</button>
    <button class="filter-btn" data-cat="基础架构">基础架构</button>
    <button class="filter-btn" data-cat="安全">安全</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">
    <p>没有找到匹配的面经。</p>
  </div>
</div>

<div class="footer">
  <p>offerseed · 面向在校生的求职资料库</p>
  <p><a href="https://github.com/offerseed/interview-experience">GitHub 仓库</a> · 欢迎投稿面经</p>
</div>

<script>
const PAGES_BASE = "https://offerseed.github.io/interview-experience";

const interviews = [
  {
    company: "AMD",
    title: "AMD GPU加速面试",
    position: "GPU 加速工程师",
    rounds: "3轮技术 + HR",
    result: "Offer ✅",
    date: "2026-09",
    category: "AI-Infra",
    categoryLabel: "AI Infra",
    tagClass: "tag-Infra",
    url: PAGES_BASE + "/by-company/AMD/AI-Infra/AMD-GPU%E5%8A%A0%E9%80%9F%E9%9D%A2%E8%AF%95.html"
  },
  {
    company: "阿里巴巴",
    title: "阿里巴巴Agent开发面试",
    position: "Agent 开发工程师",
    rounds: "4轮技术 + HR",
    result: "流程中",
    date: "2026-09",
    category: "Agent开发",
    categoryLabel: "Agent开发",
    tagClass: "tag-Agent",
    url: PAGES_BASE + "/by-company/%E9%98%BF%E9%87%8C%E5%B7%B4%E5%B7%B4/Agent%E5%BC%80%E5%8F%91/%E9%98%BF%E9%87%8C%E5%B7%B4%E5%B7%B4Agent%E5%BC%80%E5%8F%91%E9%9D%A2%E8%AF%95.html"
  }
];

let currentFilter = "all";
let searchTerm = "";

function render() {
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");

  let filtered = interviews.filter(item => {
    const catMatch = currentFilter === "all" || item.category === currentFilter;
    const searchMatch = !searchTerm ||
      item.company.toLowerCase().includes(searchTerm) ||
      item.title.toLowerCase().includes(searchTerm) ||
      item.position.toLowerCase().includes(searchTerm) ||
      item.categoryLabel.toLowerCase().includes(searchTerm);
    return catMatch && searchMatch;
  });

  document.getElementById("stat-total").textContent = filtered.length;
  const companies = new Set(filtered.map(i => i.company));
  document.getElementById("stat-companies").textContent = companies.size;

  if (filtered.length === 0) {
    grid.innerHTML = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  grid.innerHTML = filtered.map(item => `
    <a class="card" href="${item.url}" target="_blank">
      <div class="card-header">
        <span class="card-company">${item.company}</span>
        <span class="card-tag ${item.tagClass}">${item.categoryLabel}</span>
      </div>
      <div class="card-title">${item.title}</div>
      <div class="card-meta">
        <span>📍 ${item.position}</span>
        <span>🔄 ${item.rounds}</span>
        <span>📅 ${item.date}</span>
        <span>${item.result}</span>
      </div>
    </a>
  `).join("");
}

document.getElementById("filters").addEventListener("click", e => {
  if (e.target.classList.contains("filter-btn")) {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    currentFilter = e.target.dataset.cat;
    render();
  }
});

document.getElementById("search").addEventListener("input", e => {
  searchTerm = e.target.value.toLowerCase().trim();
  render();
});

render();
</script>
</body>
</html>
